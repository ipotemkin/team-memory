[project]
name = "team-memory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "boto3>=1.34",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "python-multipart>=0.0.33",
  "httpx>=0.27",
  "clickhouse-connect>=1.12.0",
  "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11",
       "import-linter>=2.0", "boto3-stubs[s3]>=1.34", "celery-types>=0.22"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["app", "tests"]
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs real Postgres/MinIO (TEST_DATABASE_URL, TEST_S3_ENDPOINT_URL)",
  "live: calls the real LLM provider (needs OPENAI_API_KEY; costs money)",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.services", "app.api", "app.adapters", "app.composition", "app.main"]

[[tool.importlinter.contracts]]
name = "Services do not import adapters or api"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.adapters", "app.api", "app.composition"]

[[tool.importlinter.contracts]]
name = "Only composition.py imports adapters"
type = "forbidden"
source_modules = ["app.api", "app.main", "app.config"]
forbidden_modules = ["app.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain and services are infrastructure-free"
type = "forbidden"
source_modules = ["app.domain", "app.services"]
forbidden_modules = ["sqlalchemy", "asyncpg", "fastapi", "boto3", "botocore", "redis", "celery", "haystack",
                     "clickhouse_connect", "prometheus_client", "starlette"]
