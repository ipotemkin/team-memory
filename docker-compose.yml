# Локальный стек: Postgres+pgvector, MinIO (оригиналы файлов), Redis (очередь Celery), API, воркер, beat, веб.
# Профили: test (api-test — интеграционные тесты), clickhouse (аудит), ollama (локальные модели).
services:
  # Postgres 16 с pgvector; init-скрипты из docker/postgres/init выполняются при первом создании тома.
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: kb, POSTGRES_PASSWORD: kb, POSTGRES_DB: kb}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-совместимое хранилище; наружу 9100 (API) и 9101 (консоль), чтобы не конфликтовать с портом 9000.
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9100:9000", "9101:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразовый контейнер: создаёт бакет documents и завершается (от него зависят api и worker).
  minio-init:
    image: pgsty/mc:latest
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/documents && echo bucket ready"
    restart: "no"

  # Брокер и backend результатов Celery.
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # FastAPI (uvicorn); healthcheck — /health/live.
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Celery-воркер: индексация документов и переиндексация моделей; healthcheck — inspect ping.
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.adapters.celery_queue.worker:celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.adapters.celery_queue.worker:celery_app inspect ping -t 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5

  # Celery beat: периодические задачи (партиции аудита); файл расписания в /tmp — без тома.
  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.adapters.celery_queue.worker:celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on: {redis: {condition: service_healthy}}

  # Веб-клиент в режиме разработки (Vite); node_modules в отдельном томе, а не в исходниках хоста.
  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: [./web:/web, webnode:/web/node_modules]
    ports: ["5173:5173"]
    environment: {VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Интеграционные тесты в контейнере: образ с dev-зависимостями (UV_SYNC_ARGS=""), код монтируется
  # только на чтение; база kb_test создаётся `make test-db`.
  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      args: {UV_SYNC_ARGS: ""}
    env_file: .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://kb:kb@postgres:5432/kb_test
      TEST_S3_ENDPOINT_URL: http://minio:9000
      TEST_S3_ACCESS_KEY: minioadmin
      TEST_S3_SECRET_KEY: minioadmin
      TEST_S3_BUCKET: kb-test
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/migrations:/app/migrations:ro
      - ./tests_data:/tests_data:ro
    # $$ — экранирование для compose: переменная подставляется уже внутри контейнера.
    command: sh -c "DB_URL=$$TEST_DATABASE_URL alembic upgrade head && pytest -q -p no:cacheprovider"
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # Этап 8: приёмник аудита ClickHouse (AUDIT_BACKEND=clickhouse|both). Порты хоста 8124 (HTTP) / 9002 (native),
  # чтобы не конфликтовать с ClickHouse, уже запущенным на хосте (9000).
  clickhouse:
    profiles: ["clickhouse"]
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: kb
      CLICKHOUSE_USER: kb
      CLICKHOUSE_PASSWORD: kb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8124:8123", "9002:9000"]
    # ClickHouse требует высокий лимит открытых файлов.
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Этап 8: локальные LLM и эмбеддинги через OpenAI-совместимый API Ollama (http://ollama:11434/v1).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes: {pgdata: {}, miniodata: {}, webnode: {}, chdata: {}, ollama: {}}
