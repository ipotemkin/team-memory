name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q

  integration-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: kb, POSTGRES_PASSWORD: kb, POSTGRES_DB: kb_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kb:kb@localhost:5432/kb_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync
      - name: Migrations up/down/up
        run: |
          DB_URL=$TEST_DATABASE_URL uv run alembic upgrade head
          DB_URL=$TEST_DATABASE_URL uv run alembic downgrade base
          DB_URL=$TEST_DATABASE_URL uv run alembic upgrade head
      - name: Integration tests (Postgres; S3 tests skipped without TEST_S3_ENDPOINT_URL)
        run: uv run pytest -q -m integration
